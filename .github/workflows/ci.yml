# Runs on every pull request and every push to main.
# A pull request should only be merged when this check is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools (exact versions from package-lock.json)
        run: npm ci

      - name: Dependency check (known vulnerable packages)
        run: npm audit --audit-level=high

      - name: Static analysis (ESLint + security rules)
        run: npm run lint

      - name: Dynamic analysis (unit tests)
        run: npm test
